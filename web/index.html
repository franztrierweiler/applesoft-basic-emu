<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applesoft BASIC — Apple II Emulator</title>
    <link rel="stylesheet" href="style.css?v=8">
    <script src="brython.js"></script>
    <script src="brython_stdlib.js"></script>
</head>
<body onload="brython({debug: 1, pythonpath: ['.']})" id="app">

    <!-- Spinner displayed during Brython initialization (CA-UC-025-06) -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
        <p class="loading-text">Loading Applesoft BASIC Emulator...</p>
    </div>

    <nav id="toolbar" class="toolbar">
        <button id="btn-load" class="toolbar-btn" title="Charger un fichier .bas">LOAD</button>
        <button id="btn-stop" class="toolbar-btn btn-stop" title="Interrompre le programme (Ctrl+C)">STOP</button>
        <button id="btn-reset" class="toolbar-btn btn-reset" title="Redémarrer l'Apple ][ (NEW + clear)">RESET</button>
    </nav>

    <main id="main-layout" class="main-layout">
        <section id="console-section" class="panel console-panel">
            <!-- Single text screen: program output, prompts, typed input and
                 the blinking cursor all share the same flow, like Apple II. -->
            <div id="console-output" class="console-output" tabindex="0"
                 ><span id="console-input-display" class="console-input-display"
                 ></span><span id="console-cursor" class="console-cursor">&nbsp;</span></div>
            <input id="console-input" class="console-input" type="text"
                   autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </section>

        <section id="canvas-section" class="panel canvas-panel" style="display: none;">
            <canvas id="graphics-canvas" width="280" height="192"></canvas>
        </section>
    </main>

    <script type="text/python" src="io_web.py"></script>

</body>
</html>
